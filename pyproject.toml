[project]
name = "ha-holos-tts"
version = "1.1.0"
description = "Ukrainian HolosTTS speech server for Home Assistant: Wyoming and OpenAI-compatible APIs"
readme = "README.md"
license = "GPL-3.0-only"
requires-python = "==3.12.*"
dependencies = [
    "ctranslate2",
    "fastapi",
    "gradio",
    "huggingface-hub",
    "ipa-uk",
    "numpy",
    "psutil",
    "sentencepiece",
    "soundfile",
    "torch",
    "ukrainian-word-stress",
    "uvicorn",
    "wyoming",
]

[project.optional-dependencies]
cpu = [
    "onnxruntime",
]
cuda = [
    "onnxruntime-gpu[cuda,cudnn]",
    # ONNX Runtime brings the CUDA 13 libraries, but the CTranslate2 wheels of the verbalizer need cuBLAS of CUDA 12
    "nvidia-cublas-cu12",
    "nvidia-cuda-runtime-cu12",
]

[project.scripts]
holos-tts = "holos_tts.__main__:run"

[dependency-groups]
dev = [
    "httpx",
    "pre-commit-uv",
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "pytest-xdist",
    "ruff",
    "ty",
]

[build-system]
requires = ["uv_build"]
build-backend = "uv_build"

# the distribution is ha-holos-tts, and the import package stays holos_tts
[tool.uv.build-backend]
module-name = "holos_tts"

[tool.uv]
# take only the releases older than a week, so a broken or a hostile release can be withdrawn first
exclude-newer = "1 week"
conflicts = [
    [
        { extra = "cpu" },
        { extra = "cuda" },
    ],
]

# torch only runs the stanza tagger of the stress model, so the small CPU build is enough in both images
[tool.uv.sources]
torch = { index = "pytorch-cpu" }
ipa-uk = { git = "https://github.com/patriotyk/ipa-uk.git", rev = "3faf05ec50fd4880965b6c76f8e479a4f82117f5" }
ukrainian-word-stress = { git = "https://github.com/patriotyk/ukrainian-word-stress.git", rev = "d5b37ea0abe9711930d9c3b0b13edec5a0675512" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# four test processes by default; "pytest -n 0" runs the tests in one process, for example to debug one test
addopts = "-n 4"

[tool.coverage.run]
source = ["holos_tts"]

# "pytest --cov" checks the gate below, a run without "--cov" does not measure coverage
[tool.coverage.report]
show_missing = true
fail_under = 85

[tool.ty.environment]
# the server runs on Linux, and multiprocessing.Pipe has a different type on Windows
python-platform = "linux"

[tool.ty.src]
# The tests use fakes and wrong values on purpose, so ty checks the package only.
include = ["src"]

[tool.ty.analysis]
# onnxruntime comes from the cpu or the cuda extra, which exclude each other, so the checker environment has neither
allowed-unresolved-imports = ["onnxruntime"]
