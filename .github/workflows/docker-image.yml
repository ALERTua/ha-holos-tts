name: Docker Image

on:
  workflow_dispatch:
    inputs:
      alert-server:
        description: Build on buildkit of alert-server when it answers. Off builds on GitHub.
        type: boolean
        default: true

  push:
    branches:
      - "main"
      - "dev"
    tags:
      - "*"
    paths-ignore:
      - "**/*.md"
      - ".github/dependabot.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: uv sync --locked --extra cpu
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run ty check
      - run: uv run pytest -q --cov

  build-and-publish:
    needs: test
    strategy:
      matrix:
        include:
          - target: cpu
            suffix: ""
          - target: cuda
            suffix: "-cuda"
    # builds on buildkit of alert-server when it answers through the tailnet, otherwise on GitHub
    uses: ALERTua/ci-workflows/.github/workflows/docker-build.yml@5bd1c8f130c8fcfd14b19b83063740a407da38fc # docker-build
    permissions:
      contents: read # checkout
      packages: write # push of the images to ghcr.io
      id-token: write # Tailscale accepts the GitHub OIDC token instead of a key
    with:
      target: ${{ matrix.target }}
      suffix: ${{ matrix.suffix }}
      # the CUDA libraries do not fit on a GitHub-hosted runner without this
      free-disk-space: ${{ matrix.target == 'cuda' }}
      alert-server: ${{ github.event_name != 'workflow_dispatch' || inputs.alert-server }}
