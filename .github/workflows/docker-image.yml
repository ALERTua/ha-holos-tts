name: Docker Image

on:
  workflow_dispatch:
    inputs:
      alert-server:
        description: Build on buildkit of alert-server when it answers. Off builds on GitHub.
        type: boolean
        default: true
      push:
        description: Push the images of a run on a branch other than main, with the branch name as the tag.
        type: boolean
        default: false

  push:
    branches:
      - "main"
      - "dev"
    tags:
      - "*"
    paths-ignore:
      - "**/*.md"
      - ".github/dependabot.yml"

  # a pull request runs the tests and builds the images without a push
  pull_request:
    branches:
      - "main"
    paths-ignore:
      - "**/*.md"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # paths-ignore of pull_request looks at the whole diff of the pull request, so a later push of only .md files
  # still runs everything; this job compares the push with the head before it
  changes:
    uses: ALERTua/ci-workflows/.github/workflows/changes.yml@v4.2.0
    permissions:
      contents: read # checkout of the history for the diff

  test:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --locked --extra cpu
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run ty check
      - run: uv run pytest -q --cov

  build-and-publish:
    needs: test
    strategy:
      matrix:
        include:
          - target: cpu
            suffix: ""
          - target: cuda
            suffix: "-cuda"
    # builds on buildkit of alert-server when it answers through the tailnet, otherwise on GitHub
    uses: ALERTua/ci-workflows/.github/workflows/docker-build.yml@v4.1.0
    permissions:
      contents: read # checkout
      packages: write # push of the images to ghcr.io
      id-token: write # Tailscale accepts the GitHub OIDC token instead of a key
    with:
      target: ${{ matrix.target }}
      suffix: ${{ matrix.suffix }}
      # the CUDA libraries do not fit on a GitHub-hosted runner without this
      free-disk-space: ${{ matrix.target == 'cuda' }}
      alert-server: ${{ github.event_name != 'workflow_dispatch' || inputs.alert-server }}
      push: ${{ github.event_name == 'workflow_dispatch' && inputs.push }}
