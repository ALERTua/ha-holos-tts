version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns: ["*"]
  # pyproject.toml and uv.lock
  - package-ecosystem: uv
    directory: "/"
    schedule:
      interval: "weekly"
    # the same delay as exclude-newer = "1 week" in pyproject.toml, else uv refuses the proposed version
    cooldown:
      default-days: 7
  # base images in the Dockerfile
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: "weekly"
