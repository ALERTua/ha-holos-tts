version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns: ["*"]
  # pyproject.toml and uv.lock
  - package-ecosystem: uv
    directory: "/"
    schedule:
      interval: "weekly"
    # the cooldown applies only to version updates, security updates come at once
    cooldown:
      default-days: 7
    ignore:
      # gradio requires huggingface-hub<2, and the update to 2.x downgrades gradio by a major version
      - dependency-name: "huggingface-hub"
        update-types: ["version-update:semver-major"]
  # base images in the Dockerfile
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: "weekly"
