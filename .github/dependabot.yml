version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns: ["*"]
  # pyproject.toml and uv.lock
  - package-ecosystem: uv
    directory: "/"
    schedule:
      interval: "weekly"
  # base images in the Dockerfile
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: "weekly"
